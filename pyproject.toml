# The tool needs no install step: install.sh copies it into place and it uses
# only the standard library. This file holds metadata and lint settings.
[project]
name = "squirrel"
dynamic = ["version"]
description = "Save the shell commands you keep looking up, and find them again."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
squirrel = "squirrel.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squirrel"]

[tool.setuptools.dynamic]
version = { attr = "squirrel.__version__" }

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # keep typing.List/Optional for Python 3.8
    "UP031",                             # %-formatting is fine
]
